# Entorno igual al diagrama de despliegue (Entrega 6):
#   Servidor de BD:            PostgreSQL 16 con esquema_capital_humano.sql
#   Servidor de aplicaciones:  JVM 21 > Tomcat 10 con capital-humano.war
#
# Uso:
#   mvn package            (genera target/capital-humano.war)
#   docker compose up -d   (http://localhost:8080/capital-humano)
services:
  bd:
    image: postgres:16
    environment:
      POSTGRES_DB: capital_humano
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital
    ports:
      - "5432:5432"
    volumes:
      - ./sql/esquema_capital_humano.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./sql/datos_prueba.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital -d capital_humano"]
      interval: 3s
      retries: 20

  app:
    image: tomcat:10.1-jdk21
    depends_on:
      bd:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://bd:5432/capital_humano
      DB_USER: capital
      DB_PASSWORD: capital
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    volumes:
      - ./target/capital-humano.war:/usr/local/tomcat/webapps/capital-humano.war
