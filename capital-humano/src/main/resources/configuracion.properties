# Repositorio de configuraciones del sistema (CU026)
# ---------------------------------------------------

# Base de datos (se pisa con DB_URL / DB_USER / DB_PASSWORD)
db.url=jdbc:postgresql://localhost:5432/capital_humano
db.usuario=capital
db.password=capital

# Cuestionario
cuestionario.preguntasPorBloque=4
# Tiempo máximo para completarlo, en minutos, desde el primer ingreso (CU026 obs. 2)
cuestionario.tiempoMaxMinutos=60
# Cantidad máxima de accesos permitidos
cuestionario.accesosMaximos=5
# Días que puede estar en estado "Activo" sin que el candidato ingrese (CU026 1.B)
cuestionario.diasMaxActivo=7
cuestionario.instrucciones=El cuestionario está dividido en bloques de preguntas. En cada bloque tiene que responder TODAS las preguntas eligiendo una opción y presionar "Siguiente" (o "Finalizar" en el último bloque). Una vez guardado un bloque no se puede volver a verlo ni modificarlo. Si sale, puede volver a ingresar con su documento y clave y continuar desde el primer bloque sin responder, siempre que no se supere el tiempo máximo ({tiempo} minutos desde el primer ingreso) ni la cantidad máxima de accesos ({accesos}).

# Autenticación de consultores: simulación del LDAP de la organización.
# El usuario tiene que existir en la tabla consultor; la contraseña es esta para todos.
ldap.simulado.password=consultor
